# Maps FUMBBL player portraits onto the TourPlay positions that should use them.
# TourPlay does not expose usable player artwork, so teams imported from TourPlay
# borrow FUMBBL's.
#
# The keys are the same FUMBBL URLs used by `files/fumbbl/icons.ini`.
#
# The value is a comma-separated list of the TourPlay positions the icon set
# covers, written as either `<Roster>/<Position>` or a bare `<Position>`. A bare
# position matches that position in any roster and acts as the fallback for the
# fully qualified format. Star players are always written bare, as they are
# hired across rosters.
#
# Every `players/portraits/` URL in `files/fumbbl/icons.ini` and
# `files/fumbbl/icons-extra.ini` must appear here, mapped or empty. The
# `checkTourPlayIcons` Gradle task will check this and fail if the files drift
# apart.
