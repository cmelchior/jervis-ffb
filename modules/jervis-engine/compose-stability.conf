// ---------------------------------------------------------------------------------------------
// Compose stability configuration for the engine.
//
// No module under `modules/jervis-engine` applies the Compose compiler plugin, so no engine class
// carries `@StabilityInferred`. Without that, the Compose compiler in `jervis-ui` has to assume
// the worst about every engine type it sees. Examples:
//
//   - a final class (e.g. `Direction`) is reported `unstable`.
//   - an interface (e.g. `Location`) is reported `runtime`, which resolves to *identity*
//     comparison at runtime
//
// Listing a type here tells the compiler to treat it as stable, which turns `Composer.changedInstance`
// (identity) into `Composer.changed` (equals) at every call site.
//
// WHEN TO ADD A TYPE
//
// Only add a type when *every* implementation satisfies all of:
//
//   1. All properties are `val`
//   2. `equals`/`hashCode` compare by value (`data class`, `data object`, enum, or hand-written)
//   3. No mutable collections - use `PersistentList`/`PersistentMap`, not `MutableList`
//   4. The hierarchy is sealed, or otherwise closed enough that (1)-(3) can be checked manually.
//
// Some other rules:
//   - Engine model classes with `var` properties should not be added. They are unstable by definition.
//   - Interfaces always marked as unstable and should be added if possible.
//   - Enums and @JvmInline classes are Stable by default. No need to add them.
//
// FORMAT
//
// One fully-qualified name per line. Blank lines are ignored. `//` comments are only allowed at
// the start of a line - a trailing comment is a build error. `*` matches a single name segment,
// `**` matches several. Verify changes by building with `-PcomposeReports=true` and reading
// `build/compose_compiler/*-classes.txt`.
// ---------------------------------------------------------------------------------------------

