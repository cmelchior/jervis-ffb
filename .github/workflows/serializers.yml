name: Check Serializers

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check-serializers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle and task/dependency caching
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Check generated serializers
        run: |
          ./gradlew generateSerializers
          git diff --exit-code
